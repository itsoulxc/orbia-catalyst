name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: pip install pyinstaller
      - name: Build engine and installer
        shell: pwsh
        run: |
          ./packaging/build-engine.ps1
          ./packaging/build-installer.ps1
      - name: Create checksums and update manifest
        shell: pwsh
        run: |
          $asset = Get-Item release/installer/Catalyst-Setup.exe
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            product = 'Orbia Catalyst'
            version = "${{ github.ref_name }}".TrimStart('v')
            installer = $asset.Name
            sha256 = $hash
            size = $asset.Length
            repository = 'itsoulxc/orbia-catalyst'
          } | ConvertTo-Json | Set-Content release/installer/update-manifest.json
          "$hash  $($asset.Name)" | Set-Content release/installer/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/installer/Catalyst-Setup.exe
            release/installer/update-manifest.json
            release/installer/SHA256SUMS.txt
