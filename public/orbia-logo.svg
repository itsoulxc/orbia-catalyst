<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#431407" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="monolith" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <!-- Ambient Core Aura -->
  <circle cx="60" cy="60" r="52" fill="url(#coreGlow)" />

  <!-- Outer Orbital Track -->
  <circle cx="60" cy="60" r="46" stroke="url(#ringGrad1)" stroke-width="1.5" stroke-dasharray="18 8 4 8" opacity="0.65" />

  <!-- Tilted Elliptical Orbits (Orbia Signature) -->
  <ellipse cx="60" cy="60" rx="44" ry="18" transform="rotate(-32 60 60)" stroke="url(#ringGrad1)" stroke-width="2.75" stroke-linecap="round" />
  <ellipse cx="60" cy="60" rx="44" ry="18" transform="rotate(32 60 60)" stroke="url(#ringGrad2)" stroke-width="2.25" stroke-dasharray="60 20" stroke-linecap="round" />

  <!-- Central Catalyst Diamond / Singularity -->
  <path d="M60 22 C63 44, 72 53, 94 60 C72 67, 63 76, 60 98 C57 76, 48 67, 26 60 C48 53, 57 44, 60 22 Z" fill="url(#monolith)" />
  
  <!-- Inner Void Core -->
  <circle cx="60" cy="60" r="6.5" fill="#0d0c0b" stroke="#fed7aa" stroke-width="1.75" />

  <!-- Orbital Nodes -->
  <circle cx="23" cy="39" r="3" fill="#fdba74" />
  <circle cx="97" cy="81" r="2.5" fill="#fb923c" />
  <circle cx="60" cy="14" r="2" fill="#fed7aa" opacity="0.8" />
</svg>
