<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalyst Setup</title>
<style>
:root{
  --bg:#0b0a09;--text:#f6f0e7;--muted:#a89f91;--dim:#756d63;--line:rgba(245,239,230,.15);
  --orange:#f97316;--amber:#fb923c;--soft:#fdba74;--red:#f0705a;
  --ui:"Segoe UI Variable Text","Segoe UI",sans-serif;--disp:Bahnschrift,"Segoe UI Variable Display","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--amber);outline-offset:2px}

#app{position:fixed;inset:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,235,215,.14)}
#art{position:absolute;inset:0;width:100%;height:100%}
#art.flat{background:url(/logo.svg) 77% 50%/420px no-repeat}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(11,10,9,.97) 0,rgba(11,10,9,.93) 40%,rgba(11,10,9,0) 62%)}

.bar{position:absolute;inset:0 0 auto;height:40px;display:flex;justify-content:flex-end;z-index:5}
.drag{flex:1}
.win{width:46px;height:40px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.win:hover{background:rgba(255,255,255,.08);color:var(--text)}
.win.x:hover{background:#c42b1c;color:#fff}
.win svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.3;fill:none}

.brand{position:absolute;left:44px;top:30px;display:flex;align-items:center;gap:10px;font:600 18px var(--disp);z-index:6;pointer-events:none}
.brand img{width:30px;height:30px}

.view{position:absolute;left:44px;top:84px;bottom:36px;width:392px;display:none;flex-direction:column;z-index:4;animation:in .4s ease both}
.view.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font:600 33px/1.1 var(--disp);letter-spacing:-.01em}
.lead{margin-top:7px;color:var(--muted)}

.opts{margin-top:18px;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:22px 1fr auto;gap:0 8px;align-items:center;width:100%;padding:9px 2px;text-align:left;border-bottom:1px solid var(--line);transition:background .15s}
.opt:hover{background:rgba(255,255,255,.03)}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim);transition:border .15s}
.opt.on .dot{border:5px solid var(--orange)}
.opt b{font-weight:600;font-size:15px}
.opt small{grid-column:2;font-size:12.5px;color:var(--muted)}
.opt em{grid-column:3;grid-row:1/3;font:500 15px var(--disp);color:var(--muted)}
.opt.on em{color:var(--text)}
.tag{margin-left:8px;font-size:11.5px;font-weight:600;color:var(--soft)}

.place{display:flex;align-items:center;gap:12px;margin-top:14px}
.path{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.link{flex:none;font-size:13px;font-weight:600;color:var(--soft)}
.link:hover{color:#fff}
.check{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:13px;color:var(--muted);cursor:pointer;width:fit-content}
.check input{position:absolute;opacity:0}
.box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--dim);display:grid;place-items:center}
.box svg{width:11px;height:11px;stroke:#160b05;stroke-width:2.6;fill:none;opacity:0}
.check input:checked+.box{background:var(--orange);border-color:var(--orange)}
.check input:checked+.box svg{opacity:1}

.go{margin-top:auto;display:flex;align-items:center;gap:14px}
.btn{height:44px;padding:0 26px;border-radius:7px;background:var(--orange);color:#180b03;font-weight:600;font-size:15px;transition:background .15s,transform .1s}
.btn:hover{background:var(--amber)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.note{font-size:12.5px;color:var(--dim)}

.pct{margin-top:auto;font:300 96px/1 var(--disp);letter-spacing:-.02em}
.pct sup{font-size:32px;margin-left:4px;color:var(--muted);vertical-align:42px}
.stage{margin-top:12px;font-weight:600;font-size:16px}
.detail{margin-top:2px;min-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.track{height:3px;margin-top:18px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#c2410c,var(--amber) 80%,#ffe0bd)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.foot .link{color:var(--muted)}.foot .link:hover{color:#fff}

.fin{margin-top:auto}
.fin h1{font-size:40px}
.fin .lead{max-width:360px;overflow-wrap:anywhere}
.fin .go{margin-top:26px}
.fin.bad h1{color:var(--red)}

.ask{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(6,5,4,.66)}
.ask.on{display:grid}
.ask>div{width:372px;padding:24px;border-radius:10px;background:#171411;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.6);animation:in .2s ease both}
.ask h2{font:600 20px var(--disp)}
.ask p{margin-top:6px;color:var(--muted)}
.ask .go{margin-top:20px;justify-content:flex-end;gap:10px}
.ask .btn{height:38px;padding:0 16px;font-size:14px}
@media (prefers-reduced-motion:reduce){.view,.ask>div{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="art" aria-hidden="true"></canvas>
  <div class="scrim"></div>

  <div class="bar">
    <div class="drag" data-drag></div>
    <button class="win" id="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
    <button class="win x" id="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
  </div>
  <div class="brand"><img src="/logo.svg" alt="">Catalyst</div>

  <section class="view on" id="vSetup" data-drag>
    <h1>Install Catalyst</h1>
    <p class="lead" id="hw">Choose which models to put on this PC.</p>
    <div class="opts" role="radiogroup" aria-label="Models to install">
      <button class="opt" role="radio" data-p="essential"><i class="dot"></i><b>Light<span class="tag"></span></b><small>Spark</small><em>1 GB</em></button>
      <button class="opt" role="radio" data-p="recommended"><i class="dot"></i><b>Standard<span class="tag"></span></b><small>Spark and Prism</small><em>3 GB</em></button>
      <button class="opt" role="radio" data-p="complete"><i class="dot"></i><b>Everything<span class="tag"></span></b><small>Spark, Prism, Zenith and Apex</small><em>9 GB</em></button>
    </div>
    <div class="place"><span class="path" id="path"></span><button class="link" id="change">Change folder</button></div>
    <label class="check"><input type="checkbox" id="desktop" checked><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.4"/></svg></span>Desktop shortcut</label>
    <div class="go"><button class="btn" id="install">Install</button></div>
  </section>

  <section class="view" id="vWork" data-drag>
    <div class="pct"><span id="pct">0</span><sup>%</sup></div>
    <div class="stage" id="stage">Starting</div>
    <div class="detail" id="detail"></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="foot"><span id="eta"></span><button class="link" id="cancel">Cancel</button></div>
  </section>

  <section class="view" id="vDone" data-drag>
    <div class="fin" id="fin">
      <h1 id="dTitle">Catalyst is installed</h1>
      <p class="lead" id="dText"></p>
      <div class="go"><button class="btn" id="open">Open Catalyst</button><button class="btn ghost" id="finish">Close</button></div>
    </div>
  </section>

  <div class="ask" id="ask"><div>
    <h2>Cancel the install?</h2>
    <p>Files copied so far will be removed.</p>
    <div class="go"><button class="btn ghost" id="stay">Keep installing</button><button class="btn" id="quit">Cancel install</button></div>
  </div></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function send(cmd){try{if(window.ipc&&window.ipc.postMessage)return window.ipc.postMessage(cmd);}catch(e){}
  fetch('/api/window?cmd='+encodeURIComponent(cmd),{method:'POST'}).catch(()=>{});}

let profile='recommended',busy=false,folder='';
let speed=1,target=0,shown=0,started=0,timer=0;

document.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('button,label,input'))return;
  if(e.target.closest('[data-drag]'))send('drag');
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

function view(id){$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));}
function pick(p){profile=p;$$('.opt').forEach(o=>{const on=o.dataset.p===p;o.classList.toggle('on',on);o.setAttribute('aria-checked',on);});}
$$('.opt').forEach(o=>o.onclick=()=>pick(o.dataset.p));
pick(profile);

fetch('/api/get_folder').then(r=>r.json()).then(d=>{folder=d.path||'';$('#path').textContent=folder;$('#path').title=folder;}).catch(()=>{});
fetch('/api/hardware').then(r=>r.json()).then(h=>{
  const p=h.recommended_profile||'recommended';pick(p);
  $(`.opt[data-p="${p}"] .tag`).textContent='Suits this PC';
  $('#hw').textContent=`This PC has ${Math.round(h.total_ram_gb)} GB of memory and ${h.cpu_cores} CPU cores.`;
}).catch(()=>{});

$('#change').onclick=async()=>{try{const d=await(await fetch('/api/select_folder',{method:'POST'})).json();
  if(d.path){folder=d.path;$('#path').textContent=folder;$('#path').title=folder;}}catch(e){}};

$('#min').onclick=()=>send('min');
$('#close').onclick=()=>busy?$('#ask').classList.add('on'):send('close');
$('#cancel').onclick=()=>$('#ask').classList.add('on');
$('#stay').onclick=()=>$('#ask').classList.remove('on');
$('#quit').onclick=()=>fetch('/api/cancel_cleanup',{method:'POST'}).catch(()=>{});
$('#finish').onclick=()=>send('close');
$('#install').onclick=install;

async function install(){
  busy=true;speed=3.2;target=1;shown=0;started=Date.now();
  $('#eta').textContent='';$('#stage').textContent='Starting';$('#detail').textContent='';
  $('#fin').classList.remove('bad');view('vWork');requestAnimationFrame(tick);
  const d=$('#desktop').checked?1:0;
  try{await fetch(`/api/install?profile=${profile}&desktop=${d}`,{method:'POST'});}catch(e){}
  clearInterval(timer);timer=setInterval(poll,450);poll();
}
function tick(){
  if(!busy&&shown>=target-.05)return;
  shown+=(target-shown)*.1;
  $('#pct').textContent=Math.round(shown);$('#fill').style.width=shown.toFixed(1)+'%';
  requestAnimationFrame(tick);
}
async function poll(){
  try{
    const s=await(await fetch('/api/status')).json();
    target=s.progress||0;$('#stage').textContent=s.stage||'';$('#detail').textContent=s.detail||'';
    const sec=(Date.now()-started)/1000;
    if(s.progress>12&&sec>6){const left=(100-s.progress)/(s.progress/sec);
      $('#eta').textContent=left<60?'Less than a minute left':`About ${Math.ceil(left/60)} min left`;}
    if(s.done){clearInterval(timer);busy=false;$('#ask').classList.remove('on');speed=1;setTimeout(()=>done(s),s.error?150:600);}
  }catch(e){}
}
function done(s){
  const open=$('#open');
  if(s.error){
    $('#fin').classList.add('bad');$('#dTitle').textContent='Install stopped';
    $('#dText').textContent=s.detail||'Check your disk space and connection, then try again.';
    open.textContent='Try again';open.onclick=install;
  }else{
    $('#dTitle').textContent='Catalyst is installed';$('#dText').textContent=folder;
    open.textContent='Open Catalyst';
    open.onclick=()=>{fetch('/api/launch',{method:'POST'}).catch(()=>{});setTimeout(()=>send('close'),400);};
  }
  view('vDone');
}

/* Background: the same gyroscope as the website, rendered live. */
(function(){
const c=$('#art'),gl=c.getContext('webgl',{antialias:false,alpha:false});
if(!gl){c.classList.add('flat');return;}
const FS=`precision highp float;uniform vec2 R,M,O;uniform float T,S,F;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453);}
float ring(vec3 p,float R0,float w,float h){vec2 q=vec2(length(p.xz)-R0,p.y);q=abs(q)-vec2(w,h);return length(max(q,0.))+min(max(q.x,q.y),0.)-.006;}
float star(vec3 p){vec3 a=pow(abs(p*vec3(1.,1.,2.5))+.0001,vec3(.64));float k=a.x+a.y+a.z;return (pow(k,1./.64)-1.04)*.1;}
vec2 map(vec3 p){
  vec3 q=p;q.xz*=rot(.22*sin(T*.21)+S*.7);q.yz*=rot(.12*cos(T*.17));
  float d=star(q);float id=1.;
  float c=length(q)-.145;if(c<d){d=c;id=2.;}
  float ch=max(abs(length(q.xy)-.175)-.012,abs(q.z)-.17);if(ch<d){d=ch;id=4.;}
  vec3 a=q;a.xy*=rot(.56);a.yz*=rot(.44);
  float r=ring(a,1.48,.02,.034);if(r<d){d=r;id=3.;}
  vec3 b=q;b.xy*=rot(-.56);b.yz*=rot(.44);float gB=atan(b.z,b.x)-T*.38;
  r=ring(b,1.48,.018,.03);r=max(r,-(abs(fract(gB/6.2832*3.)-.5)-.44)*1.2);if(r<d){d=r;id=3.;}
  vec3 o=q;o.xy*=rot(T*.04);o.yz*=rot(1.5708+.32*sin(T*.13)+S*1.2);float gC=atan(o.z,o.x);
  r=ring(o,1.92,.014,.055);r=max(r,(.05-abs(fract(gC/6.2832*6.)-.5))*.95);if(r<d){d=r;id=5.;}
  vec3 n1=a-vec3(cos(T*.5)*1.48,0.,-sin(T*.5)*1.48);r=length(n1)-.058;if(r<d){d=r;id=6.;}
  vec3 n2=b-vec3(cos(-T*.38+2.)*1.48,0.,-sin(-T*.38+2.)*1.48);r=length(n2)-.044;if(r<d){d=r;id=6.;}
  return vec2(d,id);}
vec3 nrm(vec3 p){vec2 e=vec2(.0012,-.0012);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
vec3 env(vec3 d){
  float u=d.y*.5+.5;vec3 c=mix(vec3(.012,.009,.008),vec3(.05,.035,.03),u*u);
  float top=smoothstep(.55,.95,d.y)*smoothstep(1.,.2,abs(d.x+.25));c+=vec3(1.5,1.32,1.12)*top;
  float strip=smoothstep(.1,.0,abs(d.x-.78))*smoothstep(.75,.3,abs(d.y-.1));c+=vec3(1.4,.62,.22)*strip*1.3;
  float low=smoothstep(-.35,-.95,d.y);c+=vec3(.75,.2,.04)*low*.8;
  float back=smoothstep(.1,.0,abs(d.y+.08))*smoothstep(-.1,.9,-d.z);c+=vec3(.35,.2,.14)*back;
  return c;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;uv-=O;
  vec3 ro=vec3(0.,0.,6.6),rd=normalize(vec3(uv,-F));
  ro.yz*=rot(M.y*.16-.08);rd.yz*=rot(M.y*.16-.08);ro.xz*=rot(M.x*.22);rd.xz*=rot(M.x*.22);
  float v=length(uv+O*.6);
  vec3 col=mix(vec3(.011,.0072,.0055),vec3(.0033,.0029,.0026),smoothstep(.0,.95,v));
  vec2 st=gl_FragCoord.xy/R.y*260.;float sh=hash(floor(st));
  if(sh>.9965)col+=vec3(1.,.82,.66)*smoothstep(.42,.0,length(fract(st)-.5))*(.25+.5*fract(sh*91.));
  float b=dot(ro,rd),disc=b*b-dot(ro,ro)+6.1;float glow=0.;
  if(disc>0.){
    float t=-b-sqrt(disc),tmax=-b+sqrt(disc),id=0.;
    for(int i=0;i<96;i++){vec3 pp=ro+rd*t;vec2 h=map(pp);if(h.x<.0012){id=h.y;break;}
      glow+=.012/(1.+abs(star(pp))*90.);t+=h.x*.85;if(t>tmax)break;}
    if(id>.5){
      vec3 p=ro+rd*t,n=nrm(p),r=reflect(rd,n);float f=pow(1.-max(dot(n,-rd),0.),5.);
      float ao=clamp(.35+map(p+n*.12).x/.12*.65,.0,1.);vec3 s;
      if(id<1.5){float y=smoothstep(-1.,1.,p.y);vec3 F=mix(vec3(.85,.28,.07),vec3(1.,.68,.42),y);s=env(r)*mix(F,vec3(1.),f)*1.5+F*.035;
        s+=vec3(1.,.36,.08)*pow(max(1.-length(p.xy)/1.05,0.),3.)*.38;}
      else if(id<2.5){s=env(r)*(.05+f*.95);s+=vec3(.9,.28,.05)*pow(max(dot(n,-rd),0.),30.)*.12;}
      else if(id<3.5){vec3 F=vec3(.92,.62,.4);s=env(r)*mix(F,vec3(1.),f)*1.1;}
      else if(id<4.5){s=env(r)*vec3(1.,.82,.66)*1.6;}
      else if(id<5.5){vec3 F=vec3(.42,.33,.28);s=env(r)*mix(F,vec3(1.),f)*1.05;}
      else{s=vec3(1.5,.68,.22)+env(r)*.6;}
      col=s*ao;
    }
  }
  col+=vec3(1.,.36,.09)*glow*.55;
  col=col/(1.+col*.32);col=pow(col,vec3(.4545));
  col+=(hash(gl_FragCoord.xy+T)-.5)*.022;
  gl_FragColor=vec4(col,1.);}`;
const sh=(t,s)=>{const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);return h;};
const p=gl.createProgram();
gl.attachShader(p,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS)){c.classList.add('flat');return;}
gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(p,n);
let scale=.9,slow=0,last=0,time=20,sp=1,mx=0,my=0,cx=0,cy=0;
const size=()=>{const d=Math.min(devicePixelRatio||1,1.5)*scale;c.width=innerWidth*d|0;c.height=innerHeight*d|0;gl.viewport(0,0,c.width,c.height);};
size();addEventListener('resize',size);
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
gl.uniform2f(U('O'),.31,0);gl.uniform1f(U('F'),2.15);gl.uniform1f(U('S'),0);
function frame(t){
  requestAnimationFrame(frame);if(document.hidden)return;
  const dt=Math.min(.05,(t-last)/1000||0);last=t;sp+=(speed-sp)*.03;time+=dt*sp;cx+=(mx-cx)*.05;cy+=(my-cy)*.05;
  gl.uniform2f(U('R'),c.width,c.height);gl.uniform1f(U('T'),time);gl.uniform2f(U('M'),cx,cy);
  gl.drawArrays(gl.TRIANGLES,0,3);
  slow=dt>.034?slow+1:Math.max(0,slow-1);if(slow>14&&scale>.4){scale*=.78;slow=0;size();}
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
